<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Cara kerja agentdeck: UI, core Rust, PTY, dan server MCP lokal yang menghubungkan agen">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8fb8ff"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5fd38d"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c111b"/><stop offset="1" stop-color="#0a0f16"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="599" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f4f9">Dari satu agen ke agen lain</text>
  <text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8e98ab">Setiap agen adalah CLI resmi di PTY sendiri. Agen saling bicara hanya lewat server MCP lokal, dan setiap langkah terlihat.</text>

  <!-- person -->
  <g transform="translate(40 120)">
    <rect width="190" height="96" rx="12" fill="#141a25" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="36" cy="40" r="11" fill="none" stroke="#cfd7e4" stroke-width="2"/>
    <path d="M18 74 C 20 58, 52 58, 54 74" fill="none" stroke="#cfd7e4" stroke-width="2"/>
    <text x="70" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#eef2f8">Kamu</text>
    <text x="70" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8e98ab">mengetik, menyetujui,</text>
    <text x="70" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8e98ab">menghentikan</text>
  </g>

  <!-- agentdeck container -->
  <g transform="translate(290 110)">
    <rect width="500" height="440" rx="16" fill="#101622" stroke="#5b9dff" stroke-opacity="0.5"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#cfe0ff">agentdeck.app</text>
    <text x="480" y="32" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6f7a8e">lokal · tanpa cloud</text>

    <g transform="translate(20 50)">
      <rect width="460" height="132" rx="12" fill="#151c29" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#eef2f8">UI · React + xterm.js</text>
      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#c8d1df">
        <rect x="18" y="44" width="130" height="30" rx="8" fill="#ffffff" fill-opacity="0.05"/><text x="83" y="64" text-anchor="middle">Pane terminal</text>
        <rect x="158" y="44" width="140" height="30" rx="8" fill="#ffffff" fill-opacity="0.05"/><text x="228" y="64" text-anchor="middle">Kartu persetujuan</text>
        <rect x="308" y="44" width="134" height="30" rx="8" fill="#ffffff" fill-opacity="0.05"/><text x="375" y="64" text-anchor="middle">Log pesan</text>
        <rect x="18" y="84" width="130" height="30" rx="8" fill="#ffffff" fill-opacity="0.05"/><text x="83" y="104" text-anchor="middle">Peluncur</text>
        <rect x="158" y="84" width="140" height="30" rx="8" fill="#ffffff" fill-opacity="0.05"/><text x="228" y="104" text-anchor="middle">Pengaman putaran</text>
        <rect x="308" y="84" width="134" height="30" rx="8" fill="#ffffff" fill-opacity="0.05"/><text x="375" y="104" text-anchor="middle">Settings</text>
      </g>
    </g>
    <path d="M250 190 L250 214" stroke="#8fb8ff" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="262" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#7d879a">Tauri IPC</text>

    <g transform="translate(20 222)">
      <rect width="460" height="198" rx="12" fill="#151c29" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#eef2f8">Core · Rust</text>
      <text x="442" y="28" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#7d879a">semua keputusan keamanan di sini</text>
      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#c8d1df">
        <rect x="18" y="44" width="206" height="30" rx="8" fill="#ffffff" fill-opacity="0.05"/><text x="121" y="64" text-anchor="middle">PTY + status agen</text>
        <rect x="236" y="44" width="206" height="30" rx="8" fill="#ffffff" fill-opacity="0.05"/><text x="339" y="64" text-anchor="middle">Kebijakan, batas, kuota</text>
        <rect x="18" y="84" width="206" height="30" rx="8" fill="#ffffff" fill-opacity="0.05"/><text x="121" y="104" text-anchor="middle">Antrean pesan</text>
        <rect x="236" y="84" width="206" height="30" rx="8" fill="#ffffff" fill-opacity="0.05"/><text x="339" y="104" text-anchor="middle">Audit + layout</text>
      </g>
      <rect x="18" y="128" width="424" height="52" rx="10" fill="#5b9dff" fill-opacity="0.1" stroke="#5b9dff" stroke-opacity="0.5"/>
      <text x="34" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#cfe0ff">Server MCP · 127.0.0.1</text>
      <text x="34" y="169" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9fb3d4">token acak per pane · cek Host/Origin · tanpa argumen perintah</text>
    </g>
  </g>

  <!-- agents -->
  <g transform="translate(860 150)">
    <rect width="300" height="120" rx="12" fill="#141a25" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#eef2f8">Claude Code</text>
    <text x="280" y="34" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#7d879a">pane p1</text>
    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8e98ab">CLI resmi, login milikmu,</text>
    <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8e98ab">config disuntik per peluncuran</text>
    <text x="20" y="104" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#9cc2ff">pane_spawn · pane_send</text>
  </g>
  <g transform="translate(860 370)">
    <rect width="300" height="120" rx="12" fill="#141a25" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#eef2f8">Codex</text>
    <text x="280" y="34" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#7d879a">pane p2 · anak p1</text>
    <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8e98ab">menerima tugas sebagai pesan</text>
    <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8e98ab">bertanda pengirim</text>
    <text x="20" y="104" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#7ee2a4">pane_read · pane_report</text>
  </g>

  <!-- arrows -->
  <path d="M232 168 L286 168" stroke="#cfd7e4" stroke-width="2" marker-end="url(#a)"/>
  <path d="M790 400 C 830 400, 820 210, 856 210" fill="none" stroke="#8fb8ff" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M790 420 C 830 420, 820 430, 856 430" fill="none" stroke="#5fd38d" stroke-width="2" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="800" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8fb8ff">MCP + PTY</text>

  <!-- flow -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#c8d1df">
    <circle cx="52" cy="268" r="11" fill="#5b9dff" fill-opacity="0.2" stroke="#5b9dff"/><text x="52" y="272" text-anchor="middle" font-weight="700" fill="#cfe0ff">1</text>
    <text x="72" y="264">p1 minta membuka Codex:</text><text x="72" y="282" fill="#8e98ab">kamu setujui di kartu</text>
    <circle cx="52" cy="330" r="11" fill="#5b9dff" fill-opacity="0.2" stroke="#5b9dff"/><text x="52" y="334" text-anchor="middle" font-weight="700" fill="#cfe0ff">2</text>
    <text x="72" y="326">p1 kirim tugas ke p2:</text><text x="72" y="344" fill="#8e98ab">diantre, lalu ditempel</text><text x="72" y="362" fill="#8e98ab">saat p2 sepi</text>
    <circle cx="52" cy="410" r="11" fill="#5fd38d" fill-opacity="0.2" stroke="#5fd38d"/><text x="52" y="414" text-anchor="middle" font-weight="700" fill="#bff0d2">3</text>
    <text x="72" y="406">p2 lapor hasil ke induk</text><text x="72" y="424" fill="#8e98ab">(pane_report)</text>
    <circle cx="52" cy="470" r="11" fill="#d29922" fill-opacity="0.2" stroke="#d29922"/><text x="52" y="474" text-anchor="middle" font-weight="700" fill="#f0d08a">!</text>
    <text x="72" y="466">Terlalu banyak bolak-balik?</text><text x="72" y="484" fill="#8e98ab">pengaman putaran menjeda</text>
  </g>
</svg>
