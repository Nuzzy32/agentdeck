# Katalog agen bawaan (PRD AGT-01, ARCHITECTURE §4). Disematkan ke binary lewat include_str! di catalogue.rs.
#
# - binary:    nama perintah yang dicari di PATH shell login. Dijalankan langsung dengan argv, tanpa shell (D-009).
# - install:   perintah pasang untuk disalin pengguna; agentdeck tidak pernah menjalankannya (AGT-02).
# - status:    osc7501_query = agen baru melapor setelah query `OSC 7501;?` dijawab (Claude, D-016);
#              osc7501 = agen melapor tanpa query (Codex).
# - mcp_args:  argv injeksi MCP. `{mcp_url}` diganti URL server lokal. Token tidak pernah masuk argv: agen membacanya
#              dari env AGENTDECK_TOKEN (Claude mengekspansi `${VAR}` sendiri).
#              Opsional untuk agen pengguna: tanpa mcp_args agen jalan tanpa injeksi.
#              Batas waktu tool 330 s di kedua agen: `pane_spawn` menunggu kartu persetujuan sampai 300 s. Tanpa itu
#              Claude Code memutus panggilan setelah 60 s ("The operation timed out", D-024).
# - task_args: harus diakhiri "--", "{task}" agar tugas yang diawali `-` tetap satu argumen (D-019).
# - login_status: perintah status login resmi CLI (claude_auth_status | codex_login_status), opsional (AGT-05).
# - api_key_env:  nama variabel kunci API agen; bila ada di shell login, Settings memberi tahu bahwa agentdeck tidak
#                 meneruskannya (D-019). Nilainya tidak pernah dibaca.
#
# Katalog pengguna: `agents.toml` di direktori data aplikasi, format sama, status boleh "none". Agen ber-id bawaan
# diabaikan kecuali `replace = true` (D-023).
#
# Flag bypass izin (--dangerously-*, --yolo, bypassPermissions, -a/-s, approval_policy, ...) ditolak saat parse
# (AGENTS.md aturan 4).

[[agents]]
id = "claude-code"
name = "Claude Code"
binary = "claude"
install = "curl -fsSL https://claude.ai/install.sh | bash"
status = "osc7501_query"
mcp_args = [
  "--mcp-config",
  '{"mcpServers":{"agentdeck":{"type":"http","url":"${AGENTDECK_MCP_URL}","headers":{"Authorization":"Bearer ${AGENTDECK_TOKEN}"},"timeout":330000}}}',
  "--allowedTools",
  "mcp__agentdeck",
]
task_args = ["--", "{task}"]
login_status = "claude_auth_status"
api_key_env = ["ANTHROPIC_API_KEY"]

[[agents]]
id = "codex"
name = "Codex"
binary = "codex"
install = "npm install -g @openai/codex"
status = "osc7501"
mcp_args = [
  "-c", 'mcp_servers.agentdeck.url="{mcp_url}"',
  "-c", 'mcp_servers.agentdeck.bearer_token_env_var="AGENTDECK_TOKEN"',
  "-c", 'mcp_servers.agentdeck.default_tools_approval_mode="approve"',
  "-c", "mcp_servers.agentdeck.tool_timeout_sec=330",
]
task_args = ["--", "{task}"]
login_status = "codex_login_status"
api_key_env = ["OPENAI_API_KEY"]
