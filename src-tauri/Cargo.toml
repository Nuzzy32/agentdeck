[package]
name = "agentdeck"
version = "0.1.0"
description = "Multi-pane terminal where coding agents hand prompts to each other over local MCP"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
portable-pty = "0.9"
tauri = { version = "2", features = [] }
# OS CSPRNG for pane tokens (tokens.rs); already in the tree via tauri, smaller than `rand`.
getrandom = "0.3"
base64 = "0.22"
# Katalog agen TOML (catalogue.rs). Keduanya sudah ada di pohon dependency Tauri; tidak menambah crate baru.
serde = { version = "1", features = ["derive"] }
toml = "1"
# MCP server (mcp/, D-017). rmcp 3.6 + axum 0.8 as proven in spikes/s8-mcp; tokio is already in the tree via tauri.
rmcp = { version = "3.6", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["net", "rt"] }

[dev-dependencies]
# HTTP client for the MCP integration test (tests/mcp_server.rs) only.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
