[package]
name = "agentdeck"
version = "0.1.0"
description = "Multi-pane terminal where coding agents hand prompts to each other over local MCP"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
portable-pty = "0.9"
tauri = { version = "2", features = [] }
# OS CSPRNG for pane tokens (tokens.rs); already in the tree via tauri, smaller than `rand`.
getrandom = "0.3"
base64 = "0.22"
# Katalog agen TOML (catalogue.rs). Keduanya sudah ada di pohon dependency Tauri; tidak menambah crate baru.
serde = { version = "1", features = ["derive"] }
toml = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
